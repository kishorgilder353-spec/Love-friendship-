<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>匿名信</title>
<style>
:root{--bg:#eef1f5;--card:rgba(255,255,255,.9);--fg:#1d2433;--sub:#6b7485;--line:#d5dae3;--ac:#1f6f78;--acfg:#fff}
[data-theme=dark]{--bg:#12161d;--card:rgba(27,33,43,.9);--fg:#e6eaf0;--sub:#8e98a8;--line:#323a48;--ac:#5fb3bd;--acfg:#0d1a1c}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
#bg{position:fixed;inset:0;z-index:-1;background:center/cover no-repeat}
#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;padding-top:env(safe-area-inset-top)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
header h1{margin:0;font-size:20px}
main{flex:1;overflow-y:auto;padding:0 14px 14px}
nav{display:flex;gap:8px;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);backdrop-filter:blur(8px)}
nav button{flex:1;padding:10px;font-size:16px;border:0;border-radius:8px;background:none;color:var(--sub)}
nav button.on{background:var(--ac);color:var(--acfg);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;backdrop-filter:blur(6px)}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font-size:15px}
.seg button.on{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
input,textarea{width:100%;padding:10px;margin-bottom:10px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.btn,.chip{padding:10px 14px;font:inherit;font-weight:600;border:0;border-radius:8px;background:var(--ac);color:var(--acfg)}
.btn{width:100%}
.chip{padding:6px 12px;font-size:14px}
.ghost{background:none;color:var(--sub);border:1px solid var(--line);font-weight:400}
.btn:disabled{opacity:.5}
.meta{display:flex;justify-content:space-between;color:var(--sub);font-size:13px}
.body{white-space:pre-wrap;word-break:break-word;margin:6px 0}
.rep{background:none;border:0;color:var(--sub);font-size:14px;padding:6px 0}
.hint{color:var(--sub);font-size:13px;margin:0 0 10px}
#gate{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
#gate .card{max-width:340px;text-align:center}
#sheet{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.45);overflow-y:auto;padding:24px 14px}
#sheet .card{max-width:480px;margin:0 auto}
#page{position:fixed;inset:0;z-index:18;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#page>div.top{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card)}
#page .top button{border:0;background:none;color:var(--ac);font:inherit;font-size:17px;font-weight:600;padding:6px 8px}
#page .top strong{font-size:17px}
#pageBody{flex:1;display:flex;flex-direction:column;min-height:0;max-width:640px;width:100%;margin:0 auto}
.scroll{flex:1;overflow-y:auto;padding:12px 14px}
.composer{padding:8px 14px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.pic{margin-top:8px;border-radius:10px;overflow:hidden;background:rgba(128,128,128,.15);min-height:60px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px}
.pic img{display:block;width:100%;max-height:420px;object-fit:cover;cursor:pointer}
.acts{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.rep.on{color:#e0457b;font-weight:600}
.cmbox{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.cm{margin:6px 0;font-size:14px}
.cm .who{color:var(--sub);font-size:12px}
.cmrow{display:flex;gap:8px;margin-top:8px}
.cmrow input{margin:0;flex:1}
.bub{max-width:80%;padding:8px 12px;border-radius:12px;margin:6px 0;white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line)}
.bub.me{margin-left:auto;background:var(--ac);color:var(--acfg);border-color:var(--ac)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);max-width:86%;padding:10px 16px;border-radius:8px;background:#222;color:#fff;font-size:14px;z-index:30}
h3{margin:14px 0 8px;font-size:16px}
</style>
</head>
<body>
<div id="bg"></div>
<script>
(function(){
  function show(t){
    var b=document.getElementById("errBox");
    if(!b){b=document.createElement("pre");b.id="errBox";
      b.style.cssText="position:fixed;left:0;right:0;top:0;z-index:99;margin:0;padding:8px;background:#7b1e1e;color:#fff;font-size:12px;white-space:pre-wrap";
      document.body.appendChild(b);}
    b.textContent+=t+"\n";
  }
  window.addEventListener("error",function(e){show("错误："+(e.message||"未知")+(e.lineno?" 行"+e.lineno:""));});
  window.addEventListener("unhandledrejection",function(e){show("错误："+((e.reason&&e.reason.message)||e.reason));});
})();
</script>


<div id="gate">
  <div class="card">
    <h2>匿名信</h2>
    <p class="hint">为防止滥用，我们会记录访问的 IP 地址，仅用于封禁恶意行为，管理员可以查看。私信内容可能会被管理员审核。</p>
    <div class="seg" id="segAuth"><button class="on" data-t="in">登录</button><button data-t="up">注册</button></div>
    <input id="uName0" maxlength="16" placeholder="用户名（2到16位，中文字母数字下划线）" autocomplete="username">
    <input id="uPass0" type="password" placeholder="密码（至少6位）" autocomplete="current-password">
    <button class="btn" id="bAuth">登录</button>
    <p class="hint" style="margin-top:10px">不需要邮箱。请牢记密码，忘记后无法找回。</p>
    <p class="hint" id="ver">版本 v12 · 脚本未启动</p>
  </div>
</div>

<div id="app">
  <header><h1>匿名信</h1><div><button class="chip ghost" id="dm">私信</button> <button class="chip ghost" id="me">我</button></div></header>
  <main>
    <section id="v-home">
      <div id="feed"></div>
      <button class="btn ghost" id="more" hidden>加载更多</button>
    </section>

    <section id="v-pub" hidden>
      <div class="seg" id="segPub"><button class="on" data-t="post">帖子</button><button data-t="anon">匿名信</button><button data-t="pub">公开信</button></div>
      <div class="card" data-p="post">
        <textarea id="pPost" rows="6" maxlength="1000" placeholder="说点什么，所有人可见"></textarea>
        <input type="file" id="pImg" accept="image/*" hidden>
        <button class="btn ghost" id="bImg" style="margin-bottom:8px">＋ 添加图片（需管理员审核）</button>
        <div id="imgPrev" hidden style="margin-bottom:10px"><img id="imgPrevImg" style="max-width:100%;max-height:260px;border-radius:10px;display:block"><button class="btn ghost" id="bImgDel" style="margin-top:6px">移除图片</button></div>
        <button class="btn" id="bPost">发布帖子</button>
      </div>
      <div class="card" data-p="anon" hidden>
        <p class="hint">只有知道数字码和密码的人才能取到这封信，请记好。</p>
        <textarea id="pAnon" rows="6" maxlength="2000" placeholder="信的内容"></textarea>
        <input id="aCode" inputmode="numeric" maxlength="12" placeholder="数字码（6到12位数字）">
        <input id="aPass" inputmode="numeric" maxlength="4" placeholder="密码（最多4位数字）">
        <button class="btn" id="bAnon">发布匿名信</button>
      </div>
      <div class="card" data-p="pub" hidden>
        <p class="hint">对方搜索收信人名字，或你设的关键词，就能看到这封信。</p>
        <input id="uName" maxlength="30" placeholder="收信人名字">
        <input id="uKey" maxlength="30" placeholder="关键词（可不填）">
        <textarea id="pPub" rows="6" maxlength="2000" placeholder="信的内容"></textarea>
        <button class="btn" id="bPub">发布公开信</button>
      </div>
    </section>

    <section id="v-find" hidden>
      <div class="seg" id="segFind"><button class="on" data-t="anon">匿名信</button><button data-t="pub">公开信</button></div>
      <div class="card" data-p="anon">
        <input id="fCode" inputmode="numeric" maxlength="12" placeholder="数字码">
        <input id="fPass" inputmode="numeric" maxlength="4" placeholder="密码">
        <button class="btn" id="bRead">取信</button>
        <div class="body" id="rOut"></div>
      </div>
      <div class="card" data-p="pub" hidden>
        <input id="fQ" maxlength="30" placeholder="收信人名字或关键词">
        <button class="btn" id="bSearch">搜索</button>
      </div>
      <div id="sOut" data-p="pub" hidden></div>
    </section>
  </main>
  <nav>
    <button data-v="pub">发布</button>
    <button data-v="home" class="on">主页</button>
    <button data-v="find">搜信</button>
  </nav>
</div>

<div id="sheet" hidden>
  <div class="card">
    <p class="hint" id="who"></p>
    <h3 style="margin-top:0">昵称</h3>
    <input id="nick" maxlength="20">
    <button class="btn" id="bNick">保存昵称</button>
    <h3>外观</h3>
    <button class="btn ghost" id="bTheme">切换日间 / 夜间</button>
    <input type="file" id="bgFile" accept="image/*" style="margin-top:10px">
    <button class="btn ghost" id="bBgDel">移除背景图</button>
    <p class="hint">背景图只保存在这台设备的浏览器里。</p>
    <h3>我发的匿名信</h3>
    <div id="mine"></div>
    <div id="adminBox" hidden>
      <h3>管理</h3>
      <button class="btn" id="bAdmin">进入管理页（举报、审核私信）</button>
    </div>
    <button class="btn ghost" id="bOut" style="margin-top:12px">退出登录</button>
    <button class="btn ghost" id="bClose" style="margin-top:12px">关闭</button>
  </div>
</div>
<div id="page" hidden>
  <div class="top"><button id="pageBack">‹ 返回</button><strong id="pageTitle"></strong></div>
  <div id="pageBody"></div>
</div>
<div id="toast" hidden></div>

<script>
function main(){
document.getElementById("ver").textContent = "版本 v12 · 脚本已启动 ✓";
const SUPABASE_URL = "https://wqyghhbrvzqvspcvruql.supabase.co";
const SUPABASE_KEY = "sb_publishable_wJnImK4HELANkdrJs3OMEg_PA7psgpZ";
// 不再依赖外部组件：直接和 Supabase 通信
function makeClient(url, key){
  const SK = "letters-session";
  let sess = null;
  try { sess = JSON.parse(localStorage.getItem(SK) || "null"); } catch {}
  const save = (v) => { sess = v; try { v ? localStorage.setItem(SK, JSON.stringify(v)) : localStorage.removeItem(SK); } catch {} };
  const norm = (j) => ({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Math.floor(Date.now() / 1000) + (j.expires_in || 3600), user: j.user });
  const H = (t) => { const h = { "Content-Type": "application/json", apikey: key }; if (t) h.Authorization = "Bearer " + t; return h; };
  const errOf = (j, st) => ({ message: (j && (j.msg || j.message || j.error_description || j.error)) || ("HTTP " + st) });
  async function call(path, opts){
    const r = await fetch(url + path, opts);
    let j = null; try { j = await r.json(); } catch {}
    return { ok: r.ok, status: r.status, j };
  }
  async function token(){
    if (!sess) return null;
    if (sess.expires_at - 30 < Date.now() / 1000){
      const { ok, j } = await call("/auth/v1/token?grant_type=refresh_token", { method: "POST", headers: H(), body: JSON.stringify({ refresh_token: sess.refresh_token }) });
      if (!ok){ save(null); return null; }
      save(norm(j));
    }
    return sess.access_token;
  }
  async function sign(path, email, password){
    const { ok, j, status } = await call(path, { method: "POST", headers: H(), body: JSON.stringify({ email, password }) });
    if (!ok) return { error: errOf(j, status) };
    if (!j.access_token) return { error: { message: "需要邮箱验证：请在 Supabase 关闭 Confirm email" } };
    save(norm(j)); return { error: null };
  }
  return {
    auth: {
      async getSession(){ await token(); return { data: { session: sess } }; },
      signUp: ({ email, password }) => sign("/auth/v1/signup", email, password),
      signInWithPassword: ({ email, password }) => sign("/auth/v1/token?grant_type=password", email, password),
      async signOut(){ if (sess) call("/auth/v1/logout", { method: "POST", headers: H(sess.access_token) }).catch(() => {}); save(null); return {}; }
    },
    async rpc(name, args){
      const t = await token();
      const { ok, j, status } = await call("/rest/v1/rpc/" + name, { method: "POST", headers: H(t), body: JSON.stringify(args || {}) });
      return ok ? { data: j, error: null } : { data: null, error: errOf(j, status) };
    },
    from(table){
      return { select: (cols) => ({ async order(col, o){
        const t = await token();
        const q = "?select=" + encodeURIComponent(cols) + "&order=" + col + "." + (o && o.ascending === false ? "desc" : "asc");
        const { ok, j, status } = await call("/rest/v1/" + table + q, { headers: H(t) });
        return ok ? { data: j, error: null } : { data: null, error: errOf(j, status) };
      } }) };
    }
  };
}
const db = makeClient(SUPABASE_URL, SUPABASE_KEY);
const $ = (id) => document.getElementById(id);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); return true; } catch { return false; } },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
const ERR = {
  "code taken": "这个数字码已被用过，换一个",
  "too many requests": "操作太频繁，请稍后再试",
  "banned": "你的账号或网络已被限制",
  "invalid code or password": "数字码需 6 到 12 位数字，密码需 1 到 4 位数字",
  "not logged in": "还没有登录成功，请刷新页面",
  "Invalid login credentials": "用户名或密码不对",
  "already registered": "这个用户名已被注册",
  "username taken": "这个用户名已被注册",
  "invalid username": "用户名需 2 到 16 位，只能是中文、字母、数字、下划线",
  "forbidden": "没有权限",
  "chat banned": "你已被禁止发送私信",
  "cannot message yourself": "不能给自己发私信",
  "not found": "找不到这条帖子",
  "bad image": "图片格式不对或太大"
};
const msgOf = (e) => { const m = (e && e.message) || ""; for (const k in ERR) if (m.includes(k)) return ERR[k]; return "出错了：" + m; };
let tt;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 3000); }
async function rpc(name, args){ const { data, error } = await db.rpc(name, args); if (error) throw error; return data; }
function run(btn, fn){ btn.onclick = async () => { btn.disabled = true; try { await fn(); } catch (e) { toast(msgOf(e)); } btn.disabled = false; }; }
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const fmt = (s) => new Date(s).toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });

function applyTheme(t){ document.documentElement.dataset.theme = t; store.set("theme", t); }
applyTheme(store.get("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
function applyBg(){ const b = store.get("bg"); $("bg").style.backgroundImage = b ? "url(" + b + ")" : "none"; }
applyBg();

function tabs(box, root){
  box.querySelectorAll("button").forEach((b) => b.onclick = () => {
    box.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
    root.querySelectorAll("[data-p]").forEach((p) => p.hidden = p.dataset.p !== b.dataset.t);
  });
}
tabs($("segPub"), $("v-pub"));
tabs($("segFind"), $("v-find"));

function show(v){
  ["home", "pub", "find"].forEach((n) => $("v-" + n).hidden = n !== v);
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
}
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => { show(b.dataset.v); if (b.dataset.v === "home") loadPosts(true); });

function report(type, id){
  if (!confirm("确定举报这条内容吗？")) return;
  rpc("report_content", { p_type: type, p_id: id }).then(() => toast("已举报")).catch((e) => toast(msgOf(e)));
}

let before = null;
const imgCache = new Map();
function getImage(id){
  if (!imgCache.has(id)) imgCache.set(id, rpc("get_image", { p_id: id }).catch((e) => { imgCache.delete(id); throw e; }));
  return imgCache.get(id);
}
const io = ("IntersectionObserver" in window) ? new IntersectionObserver((es) => {
  es.forEach((e) => { if (e.isIntersecting){ io.unobserve(e.target); e.target._load(); } });
}, { rootMargin: "300px" }) : null;
function imageBlock(id, status){
  const w = el("div");
  const box = el("div", "pic", "图片加载中…");
  w._load = async () => {
    try {
      const data = await getImage(id);
      box.textContent = "";
      const im = el("img"); im.src = data; im.alt = "图片";
      im.onclick = () => pushPage("图片", (body) => { const sc = scroller(body); const big = el("img"); big.src = data; big.style.cssText = "width:100%;border-radius:10px"; sc.append(big); });
      box.append(im);
    } catch (e) { box.textContent = "图片加载失败"; }
  };
  w.append(box);
  if (status === "pending") { const t = el("p", "hint", "审核中：现在只有你和管理员能看到这张图。"); t.style.margin = "4px 0 0"; w.append(t); }
  if (io) { io.observe(w); } else w._load();
  return w;
}
function postCard(r){
  const c = el("div", "card");
  const m = el("div", "meta");
  m.append(el("span", "", r.nickname + (r.mine ? "（我）" : "")), el("span", "", fmt(r.created_at)));
  c.append(m, el("div", "body", r.content));
  if (r.image_id) c.append(imageBlock(r.image_id, r.image_status));
  const acts = el("div", "acts");
  let liked = !!r.liked, likes = Number(r.likes || 0), cmN = Number(r.comments || 0);
  const lk = el("button", "rep");
  const paintLk = () => { lk.textContent = (liked ? "♥ " : "♡ ") + likes; lk.classList.toggle("on", liked); };
  paintLk();
  lk.onclick = async () => {
    try { const t = (await rpc("toggle_like", { p_post: r.id }))[0]; liked = t.liked; likes = Number(t.cnt); paintLk(); }
    catch (e) { toast(msgOf(e)); }
  };
  const cb = el("button", "rep");
  const paintCb = () => { cb.textContent = "评论 " + cmN; };
  paintCb();
  const box = el("div", "cmbox"); box.hidden = true;
  const list = el("div");
  const inp = el("input"); inp.maxLength = 300; inp.placeholder = "写评论";
  const sb = el("button", "chip", "发送");
  const row = el("div", "cmrow"); row.append(inp, sb);
  box.append(list, row);
  async function loadCm(){
    try {
      const rows = await rpc("list_comments", { p_post: r.id });
      list.textContent = "";
      if (!rows.length) list.append(el("p", "hint", "还没有评论，来说第一句。"));
      rows.forEach((x) => {
        const d = el("div", "cm");
        d.append(el("div", "who", x.nickname + (x.mine ? "（我）" : "") + " · " + fmt(x.created_at)), el("div", "body", x.content));
        if (x.mine || isAdmin) {
          const del = el("button", "rep", "删除");
          del.onclick = async () => {
            if (!confirm("确定删除这条评论吗？")) return;
            try { await rpc("delete_comment", { p_id: x.id }); await loadCm(); } catch (e) { toast(msgOf(e)); }
          };
          d.append(del);
        }
        list.append(d);
      });
      cmN = rows.length; paintCb();
    } catch (e) { toast(msgOf(e)); }
  }
  let loaded = false;
  cb.onclick = () => { box.hidden = !box.hidden; if (!box.hidden && !loaded){ loaded = true; loadCm(); } };
  run(sb, async () => { await rpc("add_comment", { p_post: r.id, p_content: inp.value }); inp.value = ""; await loadCm(); });
  acts.append(lk, cb);
  if (!r.mine) {
    const dm = el("button", "rep", "私信");
    dm.onclick = async () => {
      try { openChat(await rpc("start_dm", { p_post_id: r.id }), r.nickname); } catch (e) { toast(msgOf(e)); }
    };
    acts.append(dm);
  }
  if (isAdmin) {
    const who = el("button", "rep", "查看作者");
    who.onclick = () => pushPage("作者信息", (body) => renderAuthor(body, r.id));
    acts.append(who);
  }
  const rep = el("button", "rep", "举报"); rep.onclick = () => report("post", r.id);
  acts.append(rep);
  if (r.mine || isAdmin) {
    const del = el("button", "rep", "删除");
    del.onclick = () => {
      if (!confirm("确定删除这条帖子吗？")) return;

let pendingImg = null;
function compressImage(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const k = Math.min(1, 1024 / Math.max(img.width, img.height));
      const w = Math.round(img.width * k), h = Math.round(img.height * k);
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h);
      let q = 0.75, out = cv.toDataURL("image/jpeg", q);
      while (out.length > 360000 && q > 0.3){ q -= 0.1; out = cv.toDataURL("image/jpeg", q); }
      if (out.length > 380000) rej(new Error("图片太大")); else res(out);
    };
    img.onerror = () => rej(new Error("读不了这张图片"));
    img.src = url;
  });
}

const timeout = (p, ms) => Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error("连接超时，请检查网络或 VPN")), ms))]);

// 用户名不是真邮箱：把它变成一个看不见的假邮箱交给 Supabase。若注册提示邮箱无效，改这个后缀。
const FAKE_DOMAIN = "gmail.com";
async function fakeEmail(name){
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("letters:" + name.trim().toLowerCase()));
  const hex = [...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, "0")).join("");
  return "u" + hex.slice(0, 40) + "@" + FAKE_DOMAIN;
}

run($("bAuth"), async () => {
  const name = $("uName0").value.trim(), pass = $("uPass0").value;
  if (!/^[A-Za-z0-9_\u4e00-\u9fa5]{2,16}$/.test(name)) throw new Error("invalid username");
  if (pass.length < 6) throw new Error("密码至少 6 位");
  const email = await fakeEmail(name);
  if (mode === "up"){
    const { error } = await timeout(db.auth.signUp({ email, password: pass }), 10000);
    if (error) throw error;
    await rpc("register_profile", { p_username: name });
  } else {
    const { error } = await timeout(db.auth.signInWithPassword({ email, password: pass }), 10000);
    if (error) throw error;
  }
  await enter();
});

// ===== 独立页面（私信、管理）：有返回键，手机返回手势也能用 =====
const pageStack = []; let histOK = true;
function showPage(){
  const p = pageStack[pageStack.length - 1];
  if (!p){ $("page").hidden = true; refreshBadge(); return; }
  $("page").hidden = false; $("pageTitle").textContent = p.title;
  const body = $("pageBody"); body.textContent = "";
  p.tick = p.render(body) || null;
}
function pushPage(title, render){
  pageStack.push({ title, render });
  try { history.pushState({ pg: pageStack.length }, ""); } catch (e) { histOK = false; }
  showPage();
}
function popPage(){ pageStack.pop(); showPage(); }
function backPage(){ if (histOK) history.back(); else popPage(); }
window.addEventListener("popstate", () => { if (histOK && pageStack.length) popPage(); });
$("pageBack").onclick = backPage;
setInterval(() => { const p = pageStack[pageStack.length - 1]; if (p && p.tick) p.tick(); }, 5000);
function scroller(body){ const s = el("div", "scroll"); body.append(s); return s; }

async function refreshBadge(){
  try {
    const rows = await rpc("my_conversations");
    const n = rows.reduce((a, r) => a + Number(r.unread || 0), 0);
    $("dm").textContent = n ? "私信 (" + n + ")" : "私信";
  } catch (e) {}
}
setInterval(() => { if ($("gate").hidden && !pageStack.length) refreshBadge(); }, 20000);

function renderInbox(body){

    rows.forEach((r) => {
      const c = el("div", "card"); c.style.cursor = "pointer";
      const m = el("div", "meta");
      m.append(el("strong", "", r.peer), el("span", "", r.unread > 0 ? r.unread + " 条未读" : (r.last_at ? fmt(r.last_at) : "")));
      c.append(m, el("div", "body", r.last_msg || "（还没有消息）"));
      c.onclick = () => openChat(r.conv_id, r.peer);
      sc.append(c);
    });

}
function openChat(id, peer){ pushPage(peer, (body) => renderChat(body, id)); }
function renderChat(body, id){
  const sc = scroller(body);
  const bar = el("div", "composer");
  const ta = el("textarea"); ta.rows = 2; ta.maxLength = 1000; ta.placeholder = "输入消息";
  const send = el("button", "btn", "发送");
  bar.append(ta, send); body.append(bar);
  let first = true;
  async function load(){
    try {
      const rows = await rpc("get_messages", { p_conv: id });
      const atBottom = first || sc.scrollHeight - sc.scrollTop - sc.clientHeight < 80;
      sc.textContent = "";
      rows.forEach((r) => sc.append(el("div", "bub" + (r.mine ? " me" : ""), r.content)));
      if (atBottom) sc.scrollTop = sc.scrollHeight;
      first = false;
    } catch (e) { if (first) toast(msgOf(e)); }
  }
  run(send, async () => {
    await rpc("send_dm", { p_conv: id, p_content: ta.value });
    ta.value = ""; first = true; await load();
  });
  load();
  return load;
}

function userCard(sc, name, uid, banned, ips){
  const c = el("div", "card");
  const m = el("div", "meta");
  m.append(el("strong", "", name), el("span", "", banned ? "已封号" : "正常"));
  c.append(m);
  const got = ips.filter((x) => x.ip);
  if (!got.length) c.append(el("p", "hint", "没有记录到 IP（可能是 IP 记录功能上线前发的）。"));
  got.forEach((x) => c.append(el("div", "body", "IP " + x.ip + "　最后出现 " + fmt(x.last_seen) + "　共 " + x.hits + " 次")));
  const row = el("div"); row.style.cssText = "display:flex;gap:6px;flex-wrap:wrap;margin-top:6px";
  [["封号", false], ["封号+IP", true]].forEach(([t, withIp]) => {
    const b = el("button", "chip ghost", t);
    b.onclick = async () => {
      if (!confirm("确定" + t + "吗？")) return;
      try { await rpc("admin_ban", { p_user: uid, p_with_ip: withIp }); toast("已处理"); } catch (e) { toast(msgOf(e)); }
    };
    row.append(b);
  });
  c.append(row); sc.append(c);
}

    if (!rows.length) { sc.append(el("p", "hint", "找不到这条帖子。")); return; }

}

      );
      c.append(row); sc.append(c);
    });

function renderReports(body){
  const sc = scroller(body);
  rpc("admin_reports").then((rows) => {
    if (!rows.length) sc.append(el("p", "hint", "没有被举报的内容。"));
    rows.forEach((r) => {
      const c = el("div", "card");
      const m = el("div", "meta");
      m.append(el("span", "", (r.target_type === "post" ? "帖子" : "公开信") + " · " + r.cnt + " 人举报"), el("span", "", r.hidden ? "已隐藏" : "显示中"));
      c.append(m, el("div", "body", r.content || "（已删除）"));

function renderAdminChats(body){

(async function boot(){
  try {
    const { data } = await timeout(db.auth.getSession(), 8000);
    const s = data.session;
    if (s && !s.user.is_anonymous) await enter();
    else if (s) await db.auth.signOut();
  } catch (e) { toast("启动失败：" + e.message); }
})();
}
