<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>匿名信 · 测试页</title>
<style>
  :root { --bg:#fafafa; --fg:#1c1c1c; --card:#fff; --line:#d8d8d8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181d; --fg:#e8e8e8; --card:#20232a; --line:#3a3f4a; }
  }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width:480px; margin:0 auto; }
  section { background:var(--card); border:1px solid var(--line);
            border-radius:10px; padding:16px; margin-bottom:16px; }
  h2 { margin:0 0 12px; font-size:18px; }
  input, textarea, button { width:100%; box-sizing:border-box; padding:10px;
    margin-bottom:10px; font-size:16px; border-radius:6px;
    border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  button { cursor:pointer; font-weight:600; }
  #status, #result { white-space:pre-wrap; margin:0; }
</style>
</head>
<body>
<main>
  <p id="status">正在创建匿名账户…</p>

  <section>
    <h2>写一封匿名信</h2>
    <textarea id="content" rows="5" maxlength="2000" placeholder="信的内容"></textarea>
    <input id="sendCode" inputmode="numeric" placeholder="数字码（6到12位数字）">
    <input id="sendPass" inputmode="numeric" maxlength="4" placeholder="密码（最多4位数字）">
    <button id="sendBtn">发布</button>
  </section>

  <section>
    <h2>取信</h2>
    <input id="readCode" inputmode="numeric" placeholder="数字码">
    <input id="readPass" inputmode="numeric" maxlength="4" placeholder="密码">
    <button id="readBtn">查看</button>
    <p id="result"></p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  // 把下面两项换成你自己项目的值（Supabase 后台 → Project Settings → API）
  const SUPABASE_URL = "https://wqyghhbrvzqvspcvruql.supabase.co";
  const SUPABASE_KEY = "sb_publishable_wJnImK4HELANkdrJs3OMEg_PA7psgpZ";

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { lock: async (name, timeout, fn) => await fn() }
  });
  const $ = (id) => document.getElementById(id);

  const withTimeout = (p, ms, label) => Promise.race([
    p, new Promise((_, rej) => setTimeout(() => rej(new Error(label + "超时")), ms))
  ]);

  async function init() {
    // 第一步：先检查能不能连上 Supabase
    try {
      const r = await withTimeout(
        fetch(SUPABASE_URL + "/auth/v1/health", { headers: { apikey: SUPABASE_KEY } }),
        8000, "连接服务器");
      if (!r.ok) { $("status").textContent = "服务器返回异常：" + r.status; return; }
    } catch (e) {
      $("status").textContent = "连不上服务器：" + e.message + "（试试关掉或换VPN节点）";
      return;
    }
    // 第二步：匿名登录
    try {
      const { data } = await withTimeout(db.auth.getSession(), 8000, "读取登录状态");
      if (!data.session) {
        const { error } = await withTimeout(db.auth.signInAnonymously(), 10000, "匿名登录");
        if (error) { $("status").textContent = "登录失败：" + error.message; return; }
      }
      $("status").textContent = "已连接，可以使用。";
    } catch (e) {
      $("status").textContent = "登录出错：" + e.message;
    }
  }

  $("sendBtn").onclick = async () => {
    const { error } = await db.rpc("send_letter", {
      p_code: $("sendCode").value.trim(),
      p_pass: $("sendPass").value.trim(),
      p_content: $("content").value.trim(),
    });
    $("status").textContent = error ? "发布失败：" + error.message : "发布成功。";
  };

  $("readBtn").onclick = async () => {
    const { data, error } = await db.rpc("read_letter", {
      p_code: $("readCode").value.trim(),
      p_pass: $("readPass").value.trim(),
    });
    if (error) { $("result").textContent = "出错：" + error.message; return; }
    $("result").textContent = data ? data : "数字码或密码不对，没找到信。";
  };

  init();
</script>
</body>
</html>
